# CI/CD pipeline (see SPECS.md §7 Phase 6 for the full rationale).
#
# - `test` runs on every push and PR into main: lint + pytest. Only tests
#   that mock external services (OpenAI/Pinecone) run here, so no real
#   secrets are needed for this job.
# - `build-and-deploy` runs only on pushes/merges to main, and only after
#   `test` passes: builds the Docker image, pushes it to ECR, and deploys
#   it to an Amazon ECS Express Mode service.
#
# Deploys to ECS Express Mode rather than AWS App Runner: App Runner
# stopped accepting new customers on 2026-04-30, and Express Mode is
# AWS's own recommended replacement — same "give it a container image,
# get a URL" simplicity, on top of real ECS/Fargate + an Application Load
# Balancer that AWS provisions for you.
#
# AWS auth uses GitHub's OIDC provider to assume an IAM role — no
# long-lived AWS access keys are stored in GitHub. See SPECS.md §7 for the
# one-time IAM role bootstrap this depends on.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to assume the AWS role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY" --all-tags

      - name: Deploy to Amazon ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ vars.ECS_SERVICE }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: 8000
          health-check-path: /health
          cpu: "1024"
          memory: "2048"
          min-task-count: 1
          max-task-count: 3
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          # The app reads these the same way it reads .env locally (see
          # app/config.py) — set here rather than baked into the image.
          environment-variables: |
            [
              {"name": "APP_ENV", "value": "prod"},
              {"name": "PINECONE_API_KEY", "value": "${{ secrets.PINECONE_API_KEY }}"},
              {"name": "OPENAI_API_KEY", "value": "${{ secrets.OPENAI_API_KEY }}"}
            ]
